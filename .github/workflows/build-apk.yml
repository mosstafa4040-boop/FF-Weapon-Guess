
name: Build FF Weapon Guess APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir unpacked
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP_FILE" -d unpacked

      - name: Build APK
        run: |
          PROJECT_DIR=$(find unpacked -name settings.gradle -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FFWeaponGuess-APK
          path: unpacked/**/app/build/outputs/apk/debug/app-debug.apk
          
